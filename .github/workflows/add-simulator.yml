name: Add simulator asset

on:
  push:
    paths:
      - '.github/workflows/add-simulator.yml'

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download HTML
        run: |
          mkdir -p assets
          curl -fsSL "https://aka.doubaocdn.com/s/aewP83WkV7" -o "assets/科技树模拟器.html"
          test -s "assets/科技树模拟器.html"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "assets/科技树模拟器.html"
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Add simulator HTML to assets"; git push origin HEAD:main; fi
